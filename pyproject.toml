[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anime-review-mvp"
version = "0.1.0"
description = "Minimal evidence-bound anime review pipeline for one episode per run"
requires-python = ">=3.12"
dependencies = [
  "browser-use>=0.13.8",
  "httpx>=0.27,<1",
  "openai-whisper==20250625",
  "pillow>=11,<13",
  "selenium>=4.35,<5",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anime_review_mvp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
